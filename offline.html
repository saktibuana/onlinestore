<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koneksi Terputus - Tokopedia</title>
  <link rel="icon" type="image/svg+xml" href="/icons/tokopedia-logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#03AC0E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Open Sauce One", "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #F0F3F7; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #212121; }
    .card { background: #FFFFFF; border-radius: 12px; max-width: 460px; width: 90%; padding: 40px 32px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .mascot { width: 140px; height: 140px; margin: 0 auto 24px; }
    h1 { font-size: 20px; font-weight: 700; color: #212121; margin-bottom: 8px; }
    p { font-size: 14px; color: #6D7588; line-height: 1.5; margin-bottom: 24px; }
    .btn { display: inline-block; background-color: #03AC0E; color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 12px 32px; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; transition: background-color 0.2s; }
    .btn:hover { background-color: #02980C; }
    .badge { display: inline-block; background: #EBF7ED; color: #03AC0E; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mascot">
      <svg viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="70" cy="70" r="66" fill="#F0F3F7"/>
        <path d="M40 70C40 53.4 53.4 40 70 40C86.6 40 100 53.4 100 70V96C100 98.2 98.2 100 96 100H44C41.8 100 40 98.2 40 96V70Z" fill="#03AC0E"/>
        <path d="M52 46C52 35 60 26 70 26C80 26 88 35 88 46" stroke="#03AC0E" stroke-width="6" stroke-linecap="round"/>
        <circle cx="58" cy="72" r="12" fill="#FFFFFF"/>
        <circle cx="82" cy="72" r="12" fill="#FFFFFF"/>
        <circle cx="60" cy="72" r="6" fill="#212121"/>
        <circle cx="80" cy="72" r="6" fill="#212121"/>
        <path d="M66 84L70 88L74 84" fill="#FA591D"/>
        <!-- Signal disconnected indicator -->
        <circle cx="106" cy="34" r="16" fill="#FF5722"/>
        <path d="M100 28L112 40M112 28L100 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="badge">Tokopedia PWA Offline Mode</div>
    <h1>Yah, internet kamu terputus</h1>
    <p>Coba periksa koneksi Wi-Fi atau data selulermu lalu refresh halaman ini untuk kembali belanja promo hemat di Tokopedia.</p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
